<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | VegaShare</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            margin: auto;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--accent-red);
            line-height: 1;
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 20px; color: var(--text-primary); }
        p { margin-bottom: 30px; color: var(--text-secondary); }
    </style>
    
</head>
<body>
    <div class="container">
        <div class="error-container">
            
            <div class="error-code">404</div>
            <h2>Oops! This page has expired or doesn't exist.</h2>
            <p>The link you followed might be broken, or the 30-minute sharing window for that item has closed.</p>
            
            <a href="/" class="btn btn-primary" style="text-decoration: none; display: inline-block;">Return to Home</a>
        </div>

        <footer class="footer">
            <p>&copy; 2026 VegaShare Team Titans</p>
        </footer>
    </div>

    
</body>
</html>
